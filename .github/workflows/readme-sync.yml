# Syncs this repo to ReadMe.com on every push to main.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   RDME_API_KEY      — ReadMe project API key
#   RDME_OPENAPI_ID   — OpenAPI definition id (printed by `rdme openapi` on first run)
#   RDME_VERSION      — ReadMe version slug (e.g. "v1.0")
#
# Docs: https://docs.readme.com/main/docs/rdme
name: Sync to ReadMe

on:
  push:
    branches: [v1.0]
    paths:
      - "docs/**"
      - "reference/**"
      - ".github/workflows/readme-sync.yml"
  workflow_dispatch:

concurrency:
  group: readme-sync
  cancel-in-progress: false

jobs:
  openapi:
    name: Upload OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload reference/openapi.json
        uses: readmeio/rdme@v8
        with:
          rdme: openapi reference/openapi.json --key=${{ secrets.RDME_API_KEY }} --id=${{ secrets.RDME_OPENAPI_ID }}

  guides:
    name: Upload Guides
    runs-on: ubuntu-latest
    needs: openapi
    steps:
      - uses: actions/checkout@v4
      - name: Upload docs/
        uses: readmeio/rdme@v8
        with:
          rdme: docs ./docs --key=${{ secrets.RDME_API_KEY }} --version=${{ secrets.RDME_VERSION }}

  reference:
    name: Upload API Reference pages
    runs-on: ubuntu-latest
    needs: openapi
    steps:
      - uses: actions/checkout@v4
      - name: Upload reference/
        uses: readmeio/rdme@v8
        with:
          rdme: docs ./reference --key=${{ secrets.RDME_API_KEY }} --version=${{ secrets.RDME_VERSION }}
